<script src="qr.js"></script>
<script>
(function () {
  'use strict';

  var VENDEDOR = {
    nome:     'Rafael Gonçalves',
    cargo:    'Executivo de Vendas',
    telefone: '+5512982047569',
    email:    'rafael.goncalves@grupoitnet.com.br',
    empresa:  'Braz Móvel · Grupo Itnet',
    site:     'https://virtualmend8s-max.github.io/cartao-braz/rafael/'
  };

  /* ---- Foto do perfil: o dono escolhe a dele, fica salva neste navegador ---- */
  var btnFoto   = document.getElementById('btn-foto');
  var inputFoto = document.getElementById('input-foto');
  var imgFoto   = document.getElementById('foto');
  var iniciais  = document.getElementById('iniciais');
  var CHAVE_FOTO = 'braz-cartao-foto';

  function aplicarFoto(dataUrl) {
    imgFoto.src = dataUrl;
    imgFoto.hidden = false;
    iniciais.hidden = true;
  }

  var salva = null;
  try { salva = localStorage.getItem(CHAVE_FOTO); } catch (e) {}
  if (salva) { aplicarFoto(salva); }

  btnFoto.addEventListener('click', function () { inputFoto.click(); });

  inputFoto.addEventListener('change', function () {
    var arquivo = inputFoto.files && inputFoto.files[0];
    if (!arquivo) return;
    var leitor = new FileReader();
    leitor.onload = function () {
      aplicarFoto(leitor.result);
      try { localStorage.setItem(CHAVE_FOTO, leitor.result); } catch (e) {}
    };
    leitor.readAsDataURL(arquivo);
  });

  /* ---- QR ---- */
  var btnQr  = document.getElementById('btn-qr');
  var caixa  = document.getElementById('qr-caixa');
  var dica   = document.getElementById('qr-dica');
  var canvas = document.getElementById('qr');
  var desenhado = false;

  btnQr.addEventListener('click', function () {
    var abrindo = !caixa.classList.contains('aberto');
    if (abrindo && !desenhado) {
      /* Endereço público do cartão (GitHub Pages). O QR aponta SEMPRE para cá,
         mesmo quando o arquivo é aberto localmente por file:// — assim o QR
         funciona igual no computador do Raí e no celular do vendedor. */
      var URL_PUBLICA = 'https://virtualmend8s-max.github.io/cartao-braz/rafael/';

      QR.desenhar(canvas, URL_PUBLICA, {
        escuro: '#0001AD', claro: '#FFFFFF', margem: 4
      });
      desenhado = true;
    }
    caixa.classList.toggle('aberto', abrindo);
    dica.hidden = !abrindo;
    btnQr.setAttribute('aria-expanded', String(abrindo));
    btnQr.querySelector('.rotulo').textContent = abrindo ? 'Esconder QR Code' : 'Mostrar QR Code';
  });

  /* ---- vCard gerado no próprio navegador, sem servidor ---- */
  document.getElementById('btn-vcf').addEventListener('click', function () {
    var partes = VENDEDOR.nome.split(' ');
    var primeiro = partes.shift();
    var resto = partes.join(' ');
    var vcf = [
      'BEGIN:VCARD',
      'VERSION:3.0',
      'N:' + resto + ';' + primeiro + ';;;',
      'FN:' + VENDEDOR.nome,
      'ORG:' + VENDEDOR.empresa,
      'TITLE:' + VENDEDOR.cargo,
      'TEL;TYPE=CELL:' + VENDEDOR.telefone,
      'EMAIL;TYPE=WORK:' + VENDEDOR.email,
      'URL:' + VENDEDOR.site,
      'END:VCARD'
    ].join('\r\n');

    var blob = new Blob(['﻿' + vcf], { type: 'text/vcard;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = primeiro.toLowerCase() + '-braz.vcf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });
})();
</script>
